name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache: false
      - run: go test -v ./...
      - run: go vet ./...
      - run: go test ./internal/parser -run '^$' -fuzz FuzzParsers -fuzztime 10s -parallel 2
      - name: Build both architectures
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -Version v1.0.0
      - name: Offline installer tests (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1
      - name: Offline installer tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-install.ps1
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache: false
      - run: go build -trimpath -o msk.exe ./cmd/msk
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
